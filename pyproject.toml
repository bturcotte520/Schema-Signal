[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-schema-signal"
version = "0.1.0"
description = "A small, redacted OpenRouter structured-output routing reproduction kit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
schema-signal = "schema_signal.cli:main"

[tool.setuptools.packages.find]
include = ["schema_signal*"]
